<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benchwarmers Fantasy Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      background: #f4f4f4;
      color: #222;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      color: #666;
      margin-top: 0;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
    }

    .status {
      margin-top: 24px;
      padding: 12px;
      background: white;
      border-left: 4px solid #5b2aa8;
    }
  </style>
</head>
<body>
  <h1>Benchwarmers Fantasy Assistant</h1>
  <p class="subtitle">Draft and season-long help for The Benchwarmers.</p>

  <div class="team-grid">
    <section class="card">
      <h2>That's What She Said</h2>
      <p>Preston's team</p>
      <p>Roster data will appear here.</p>
    </section>

    <section class="card">
      <h2>Tinkerbell</h2>
      <p>Trena's team</p>
      <p>Roster data will appear here.</p>
    </section>
  </div>

  <div class="status" id="status">
    Checking server connection...
  </div>

  <script>
    async function checkServer() {
      const statusBox = document.getElementById("status");

      try {
        const response = await fetch("/api/health");

        if (!response.ok) {
          throw new Error("Server returned an error.");
        }

        const data = await response.json();
        statusBox.textContent = `${data.app} is connected and working.`;
      } catch (error) {
        statusBox.textContent = "Unable to connect to the server.";
      }
    }

    checkServer();
  </script>
</body>
</html>
